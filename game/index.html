<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>아스테리아 연대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 화면 규칙
 * - 토큰 밖의 색·글꼴·모서리를 쓰지 않는다. 필요한 값은 :root에 먼저 더한다.
 * - 그라데이션·글로·이모지 아이콘·장식 그림자를 쓰지 않는다. 구분은 1px 선과 바탕 단계로 한다.
 * - 강조색(--accent)은 누를 수 있는 것, 지금 고른 것, 진행 중인 일에만 쓴다. 상태는 색과 함께 글자로 알린다.
 * - 게임 화면 위의 HUD는 그래파이트 판, 읽을거리(신문)만 종이색이다. */
:root {
  --bg: #16191C; --hud: rgba(30, 33, 36, 0.94); --surface: #1E2124; --raised: #282C30; --sunk: #141619;
  --line: #3A3F45; --line-2: #4E555C; --text: #E4E6E8; --text-2: #A9B0B6; --text-3: #8A9198;
  --accent: #7CB7E8; --accent-ink: #0E1C28; --ok: #86C9A0; --warn: #E3B969; --danger: #EA9384;
  --hp: #D97A6C; --en: #86C9A0; --paper: #F2EEE4; --ink: #23201B; --scrim: rgba(12, 14, 16, 0.78); --overlay-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  --font: "Noto Sans KR", "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --serif: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 16px; --fs-5: 20px; --fs-6: 32px;
  --r1: 6px; --r2: 8px; --r3: 10px; --tap: 36px;
  --ui: var(--font); --body: var(--font); --print: var(--serif); --gold: var(--accent); --red: var(--danger); --green: var(--ok); --blue: var(--accent); --dim: var(--text-2);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-3); line-height: 1.6; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-block: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.num { font-variant-numeric: tabular-nums; }
canvas.icon { image-rendering: pixelated; flex: none; vertical-align: middle; }

.game { position: relative; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.frame { background: var(--hud); border: 1px solid var(--line); border-radius: var(--r2); }
.title { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--line); font-size: var(--fs-2); font-weight: 500; color: var(--text-2); }
.title > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toggle { flex: none; background: none; border: 0; color: var(--accent); font-size: var(--fs-1); padding: 4px; white-space: nowrap; }

/* 위 왼쪽: 시계·미션 */
.tl { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 10px; display: flex; flex-direction: column; gap: 6px; width: min(300px, 46vw); pointer-events: none; }
.tl > * { pointer-events: auto; }
.clock { padding: 6px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock .time { font-size: var(--fs-5); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .date { font-size: var(--fs-2); color: var(--text-2); }
.speed { display: flex; gap: 2px; margin-left: auto; }
.speed button { min-width: 32px; min-height: 28px; background: var(--raised); border: 1px solid var(--line); color: var(--text-2); border-radius: var(--r1); font-size: var(--fs-1); padding: 0 6px; }
.speed button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.quests .body { padding: 4px; display: flex; flex-direction: column; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; text-align: left; background: none; border: 0; border-radius: var(--r1); padding: 5px 6px; }
.q:hover { background: var(--raised); }
.q .qt { font-size: var(--fs-2); }
.q .where { font-size: var(--fs-1); color: var(--text-2); white-space: nowrap; }
.q .how { grid-column: 1 / -1; font-size: var(--fs-1); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.autopanel .body { padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 2px; }

/* 위 오른쪽: 지도·이곳의 사람들 */
.tr { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: 10px; width: min(230px, 40vw); display: flex; flex-direction: column; gap: 6px; }
.mini canvas { display: block; width: 100%; height: 140px; border-radius: 0 0 var(--r2) var(--r2); cursor: pointer; }
.here .body { max-height: 30vh; overflow: auto; padding: 4px; }
.here .body button { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: var(--r1); font-size: var(--fs-2); }
.here .body button:hover { background: var(--raised); }
.here .dot { width: 8px; height: 8px; border-radius: 2px; }
.here .nm { font-weight: 500; }
.here .act { color: var(--text-2); font-size: var(--fs-1); white-space: nowrap; }
.here .star { color: var(--accent); margin-right: 3px; }

/* 아래 왼쪽: 내 상태 */
.bl { position: absolute; left: 10px; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: flex-end; pointer-events: none; }
.bl > * { pointer-events: auto; }
.portrait { width: 64px; height: 64px; border-radius: var(--r2); border: 1px solid var(--line-2); background: var(--raised); overflow: hidden; flex: none; display: grid; place-items: center; cursor: pointer; padding: 0; }
.portrait canvas { image-rendering: pixelated; }
.stats { padding: 6px 10px; min-width: 200px; }
.stats .who { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-weight: 500; }
.stats .job { color: var(--text-2); font-size: var(--fs-1); font-weight: 400; }
.bar { display: grid; grid-template-columns: 28px 1fr 52px; gap: 6px; align-items: center; font-size: var(--fs-1); }
.bar .track { height: 8px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.gold { color: var(--text); font-variant-numeric: tabular-nums; }
.wanted { color: var(--danger); font-weight: 700; }

/* 단축바 */
.hotbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(58px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 20px); overflow-x: auto; }
.slot { width: 44px; height: 44px; flex: none; position: relative; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r1); display: grid; place-items: center; padding: 0; }
.slot[aria-pressed="true"] { border: 2px solid var(--accent); }
.slot .k { position: absolute; top: 1px; left: 3px; font-size: 10px; color: var(--text-3); }
.slot .n { position: absolute; bottom: 0; right: 3px; font-size: 11px; font-variant-numeric: tabular-nums; }
.slot.empty { opacity: 0.45; }
.handname { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); font-size: var(--fs-2); color: var(--text); background: var(--hud); border: 1px solid var(--line); border-radius: var(--r1); padding: 2px 8px; pointer-events: none; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
.handname:empty { display: none; }

/* 메뉴 줄 */
.menubar { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.mbtn, .wbtn { flex: none; min-height: var(--tap); font-size: var(--fs-2); font-weight: 500; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r1); padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap; }
.mbtn:hover, .wbtn:hover:not([disabled]) { border-color: var(--line-2); }
.mbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.mbtn kbd { font: inherit; font-size: 10px; color: var(--text-3); }
.mbtn.primary, .mbtn.gold, .wbtn.gold, .wbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wbtn.danger { border-color: var(--danger); color: var(--danger); background: var(--raised); }
.wbtn[disabled] { opacity: 0.5; cursor: default; }
.badge { background: var(--danger); color: var(--accent-ink); border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 700; }
.msep { flex: none; width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }

/* 대화·건물 선택창 */
.talk { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); width: min(780px, calc(100% - 20px)); max-height: 58vh; display: grid; grid-template-columns: 96px minmax(0, 1fr); z-index: 4; box-shadow: var(--overlay-shadow); }
.talk .face { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 6px; gap: 6px; }
.talk .face canvas { image-rendering: pixelated; border-radius: var(--r1); background: var(--raised); }
.talk .face .nm { font-weight: 700; text-align: center; }
.talk .face .sub { font-size: var(--fs-1); color: var(--text-2); text-align: center; line-height: 1.4; }
.talk .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; max-height: 58vh; }
.talk .lines { flex: none; padding: 10px 14px 6px; overflow: auto; display: flex; flex-direction: column; gap: 4px; max-height: 24vh; }
.line { font-size: var(--fs-3); }
.line.me { color: var(--accent); }
.line.me::before { content: "나 "; color: var(--text-3); }
.line.sys { color: var(--text-2); }
.line.npc b { font-weight: 700; margin-right: 6px; }
.opts { flex: 1 1 auto; min-height: 0; padding: 6px 10px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; overflow-y: auto; overscroll-behavior: contain; align-content: start; }
.opt { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r1); padding: 6px 10px; min-height: 44px; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt b { font-weight: 500; display: block; }
.opt span { font-size: var(--fs-1); color: var(--text-2); display: block; line-height: 1.4; }
.opt .k { display: inline; color: var(--text-3); margin-right: 6px; font-size: var(--fs-1); }
.opt.harm b { color: var(--danger); }
.opt.quest b { color: var(--accent); }
.opt[disabled] { opacity: 0.45; cursor: default; }

.toasts { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; width: min(520px, 50vw); z-index: 6; }
.toast { background: var(--hud); border: 1px solid var(--line); border-radius: var(--r1); padding: 4px 12px; font-size: var(--fs-2); text-align: center; animation: fade 4.5s forwards; }
.toast.warn { border-color: var(--danger); } .toast.good { border-color: var(--ok); }
@keyframes fade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.game.winopen .toasts { left: auto; right: 10px; transform: none; width: min(300px, 44vw); align-items: flex-end; }

/* 창 */
.win { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); width: min(800px, calc(100% - 20px)); max-height: calc(100% - 140px); display: flex; flex-direction: column; z-index: 5; box-shadow: var(--overlay-shadow); background: var(--surface); }
.win .title { font-size: var(--fs-3); color: var(--text); padding: 6px 12px; }
.win .x { background: none; border: 0; color: var(--text-2); min-height: var(--tap); padding: 0 6px; }
.win .body { flex: 1 1 auto; min-height: 0; padding: 12px 14px; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.win h3 { font-size: var(--fs-3); font-weight: 700; margin: 12px 0 6px; }
.tabs { flex: none; display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; min-height: var(--tap); color: var(--text-2); display: flex; gap: 6px; align-items: center; font-size: var(--fs-2); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab kbd { font: inherit; font-size: 10px; color: var(--text-3); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 8.4em minmax(0, 1fr); gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.list li.click { cursor: pointer; } .list li.click:hover { background: var(--raised); }
.list .d { color: var(--text-2); font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.list .t { min-width: 0; }
.list.compact li { grid-template-columns: 7.4em minmax(0, 1fr); padding: 4px 2px; font-size: var(--fs-2); }
.src { display: inline-block; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; margin-left: 6px; color: var(--text-2); white-space: nowrap; vertical-align: 1px; }
.src.self { border-color: var(--ok); color: var(--ok); } .src.unknown { border-color: var(--danger); color: var(--danger); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.field, .filters select, .filters input { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r1); padding: 6px 8px; min-height: var(--tap); color: var(--text); min-width: 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--text-2); } .small { font-size: var(--fs-2); }
.card { border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 12px; margin-bottom: 10px; }
.card.soft { background: var(--sunk); }
.card .ttl { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.traits { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 4px 8px; align-items: center; font-size: var(--fs-2); }
.traits .tb, .meter { height: 6px; border-radius: 3px; background: var(--sunk); border: 1px solid var(--line); overflow: hidden; display: block; }
.traits .tb span, .meter > span { display: block; height: 100%; background: var(--accent); }
.meter { flex: 1; min-width: 60px; }
.bag { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--r1); padding: 8px; }
.item .ic { display: grid; place-items: center; }
.item .nm { font-weight: 500; }
.item .acts { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.fam { display: flex; flex-wrap: wrap; gap: 6px; }
.fam button { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r1); padding: 4px 10px; min-height: 32px; font-size: var(--fs-2); }
.fam b { font-weight: 500; color: var(--text-2); margin-right: 4px; }
.mapwin canvas { width: 100%; height: min(60vh, 560px); display: block; border-radius: var(--r1); }
.graph svg { width: 100%; height: auto; display: block; }
.graph .node { cursor: pointer; }
.people { width: 100%; border-collapse: collapse; font-size: var(--fs-2); }
.people th { text-align: left; color: var(--text-2); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.people td { padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.people tbody tr { cursor: pointer; } .people tbody tr:hover, .people tr.sel td { background: var(--raised); } .people tr.dead td { color: var(--text-3); }
.starbtn { background: none; border: 0; color: var(--accent); font-size: var(--fs-4); min-width: 32px; min-height: 32px; }
.jdot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.tablewrap { overflow-x: auto; }
table.facts { width: 100%; border-collapse: collapse; font-size: var(--fs-2); }
table.facts th { text-align: left; color: var(--text-2); font-weight: 500; padding: 6px 10px 6px 0; vertical-align: top; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.facts td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.chain { border: 1px solid var(--line); border-radius: var(--r1); padding: 4px 10px; margin-bottom: 12px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: var(--fs-2); align-items: center; }
.keys kbd { font: inherit; font-size: var(--fs-1); background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.chip { display: inline-block; font-size: var(--fs-1); padding: 0 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.chip.gold, .chip.accent { border-color: var(--accent); color: var(--accent); }
.chip.green, .chip.good { border-color: var(--ok); color: var(--ok); }
.chip.mid { border-color: var(--warn); color: var(--warn); }
.chip.bad { border-color: var(--danger); color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.stat { font-size: var(--fs-2); color: var(--text-2); } .stat.err { color: var(--danger); } .stat.ok { color: var(--ok); }

/* 미션 */
.mlist { display: flex; flex-direction: column; gap: 8px; }
.mcard { border: 1px solid var(--line); border-radius: var(--r2); padding: 10px 12px; }
.mhead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.mcard ul.how { margin: 6px 0 4px; padding-left: 1.1em; font-size: var(--fs-2); color: var(--text-2); }
.mcard ul.how li:first-child { color: var(--text); }

/* 인물 수첩 */
.bio { border: 1px solid var(--line); border-radius: var(--r2); padding: 12px; margin-bottom: 14px; }
.biohead { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 10px; }
.biohead > canvas { border-radius: var(--r2); border: 1px solid var(--line); background: var(--raised); image-rendering: pixelated; flex: none; }
.bioname { font-size: var(--fs-5); font-weight: 700; line-height: 1.3; }
.bioacts { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.dream { font-weight: 700; }
.relrow { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) 6.5em; gap: 8px; align-items: center; font-size: var(--fs-2); margin-top: 4px; }

/* 마을·나라 */
.towns { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.town { margin: 0; }
.town.here { border-color: var(--accent); }
.town .sub { font-size: var(--fs-1); color: var(--text-2); margin: 8px 0 4px; }
.town .jobs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
ul.mini { margin: 0; padding-left: 1em; font-size: var(--fs-2); }

/* 만들기 */
.recipe .needs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.need { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-1); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--danger); color: var(--danger); white-space: nowrap; cursor: help; }
.need.have { border-color: var(--ok); color: var(--ok); }
.recipe { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: var(--r2); padding: 10px; }
.recipe.ok { border-color: var(--accent); }
